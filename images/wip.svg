<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 132" width="720" height="132" role="img" aria-label="Work in progress: Find My is in beta">
  <style>
    .t1{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#412402}
    .t2{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#633806}
    .t3{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#854F0B;letter-spacing:.08em}
    .swing{transform-origin:170px 30px;animation:swing 3.2s ease-in-out infinite}
    .sweep{transform-origin:62px 66px;animation:spin 4s linear infinite}
    .ping{transform-origin:62px 66px;animation:ping 2.4s ease-out infinite}
    .ping2{animation-delay:1.2s}
    .fill{animation:fill 4s ease-in-out infinite}
    .beacon{animation:blink 1.1s steps(2,end) infinite}
    @keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.25);opacity:0}}
    @keyframes fill{0%{width:4px}70%,100%{width:118px}}
    @keyframes blink{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.swing,.sweep,.ping,.fill,.beacon{animation:none}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4DC"/><stop offset="1" stop-color="#FCE3B4"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity=".75"/></linearGradient>
    <pattern id="hz" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="#EF9F27"/><rect x="7" width="7" height="14" fill="#412402"/></pattern>
    <clipPath id="card"><rect width="720" height="132" rx="16"/></clipPath>
    <clipPath id="dish"><circle cx="62" cy="66" r="40"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="720" height="132" fill="url(#sky)"/>
    <!-- radar wearing a hard hat -->
    <circle cx="62" cy="66" r="40" fill="#34C759"/>
    <g clip-path="url(#dish)">
      <circle class="ping" cx="62" cy="66" r="36" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle class="ping ping2" cx="62" cy="66" r="36" fill="none" stroke="#ffffff" stroke-width="2"/>
      <g class="sweep"><path d="M62 66L102 66A40 40 0 0 0 90 38Z" fill="url(#beam)"/></g>
    </g>
    <circle cx="62" cy="66" r="26" fill="none" stroke="#ffffff" stroke-width="2" opacity=".55"/>
    <circle cx="62" cy="66" r="9" fill="#ffffff"/>
    <circle cx="62" cy="66" r="6" fill="#0A84FF"/>
    <path d="M38 30a24 24 0 0 1 48 0z" fill="#EF9F27"/>
    <rect x="32" y="28" width="60" height="6" rx="3" fill="#BA7517"/>
    <rect x="59" y="10" width="6" height="14" rx="2" fill="#FAC775" opacity=".7"/>
    <!-- crane -->
    <path d="M118 120V22M118 22h96M118 22l20 -10h-20" stroke="#633806" stroke-width="4" fill="none" stroke-linejoin="round"/>
    <path d="M118 40l18-18M118 64l18-18M118 88l18-18" stroke="#633806" stroke-width="2"/>
    <circle class="beacon" cx="214" cy="18" r="4" fill="#E24B4A"/>
    <g class="swing">
      <path d="M170 22v34" stroke="#412402" stroke-width="1.6"/>
      <path d="M164 56h12l-6 6z" fill="#412402"/>
      <!-- tag on the hook -->
      <circle cx="170" cy="80" r="15" fill="#F5F5F7" stroke="#8E8E93" stroke-width="2"/>
      <circle cx="170" cy="80" r="9" fill="none" stroke="#C7C7CC" stroke-width="1.5"/>
      <circle cx="170" cy="80" r="2.5" fill="#8E8E93"/>
    </g>
    <!-- keys waiting for their tag -->
    <g transform="translate(262 92)" stroke="#854F0B" stroke-width="2" fill="#FAEEDA">
      <circle cx="18" cy="14" r="13"/>
      <circle cx="18" cy="14" r="5" fill="#FCE3B4"/>
      <path d="M30 18h34v8h-6v-5h-6v6h-6v-6h-16z" stroke-linejoin="round"/>
      <circle cx="-6" cy="-2" r="9" fill="none" stroke-dasharray="4 3"/>
    </g>
    <!-- text -->
    <text x="372" y="40" class="t3">WORK IN PROGRESS · BETA</text>
    <text x="372" y="64" class="t1">Find My is being built</text>
    <text x="372" y="86" class="t2">Every part is covered by tests. It still needs</text>
    <text x="372" y="103" class="t2">real accounts and AirTags: your feedback is welcome.</text>
    <!-- battery: the build charging -->
    <rect x="566" y="28" width="122" height="16" rx="4" fill="none" stroke="#633806" stroke-width="2"/>
    <rect x="689" y="32" width="4" height="8" rx="1.5" fill="#633806"/>
    <rect class="fill" x="568" y="30" width="80" height="12" rx="2.5" fill="#639922"/>
    <!-- hazard tape along the bottom -->
    <rect y="124" width="720" height="8" fill="url(#hz)"/>
  </g>
</svg>
